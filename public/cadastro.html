<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= uy, initial-scale=1.0">
    <title>Cadastro - Bot Investidor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js"></script>
</head>
<body>
    <div class="login-card">
        <h2>Criar <span>Conta</span></h2>
        
        <form id="cadastroForm">
            <div class="input-group">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Seu melhor e-mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="footer-links">
            Já tem conta? <a href="/login">Faça Login</a>
        </div>
    </div>
    
</body>
</html>
