<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Bot Investidor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="data:,">
    <script src="dashboard.js"></script>

</head>

<body>
    <div class="container">
        <header>
            <div class="header">
                <h1 id="bem-vindo">Olá! 👋</h1> <h1>Ativos Monitorados</h1>
                <button class="btn-refresh" onclick="carregarDados()">Atualizar</button>
            </div>
        </header>

        <nav class="navbar">
            <div class="logo">Minha Previdência</div>
        
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <ul class="nav-menu">
                <li><a href="#" onclick="carregarDados()">🔄 Atualizar</a></li>
                <li><a href="/api/logout" class="btn-sair-link">🚪 Sair</a></li>
            </ul>
        </nav>

        <div class="cards-container">
            <div class="card">
                <h3>Total Ativos</h3>
                <p id="total-ativos">0</p>
            </div>

            <div class="card alta">
                <h3>Maior Alta (24h)</h3>
                <p id="maior-alta">--</p>
            </div>

            <div class="card queda">
                <h3>Maior Queda (24h)</h3>
                <p id="maior-queda">--</p>
            </div>

        </div>

        <div class="main-content">
            <div class="lista-secao">
                <h2>Meus Ativos</h2>
                <div class="tabela-container">
                    <table>
                        <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Base</th>
                            <th>Alvo</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody id="corpo-tabela"></tbody>
                    </table>
                </div>
                
            </div> 

            <div class="grafico-secao">
                <h2 id="titulo-grafico">Desempenho</h2>

                <div class="chart-container">
                    <canvas id="meuGrafico"></canvas>
                </div>
            </div>
        </div>
    </div>

</body>
